<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Muhammad Sarosh — Senior Mobile Engineer</title>
  <desc id="description">Portfolio preview for Muhammad Sarosh, a Flutter, BLE, IoT, and native mobile engineering specialist.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17102f" />
      <stop offset="0.55" stop-color="#30206f" />
      <stop offset="1" stop-color="#17102f" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dc7df" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="portraitFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17102f" stop-opacity="0.7" />
      <stop offset="0.3" stop-color="#17102f" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#05020e" flood-opacity="0.6" />
    </filter>
    <clipPath id="portraitClip">
      <rect x="792" y="50" width="350" height="530" rx="34" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="73" cy="82" r="152" fill="#2dc7df" opacity="0.08" />
  <circle cx="640" cy="662" r="280" fill="#a855f7" opacity="0.08" />
  <path d="M68 541 C210 470 340 610 500 520 S720 460 795 520" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.24" />

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(68 70)">
      <rect width="262" height="42" rx="21" fill="#ffffff" opacity="0.1" />
      <circle cx="25" cy="21" r="6" fill="#2dc7df" />
      <text x="44" y="27" fill="#e9e5ff" font-size="15" font-weight="700" letter-spacing="1.4">MOBILE ENGINEER PORTFOLIO</text>
    </g>

    <text x="68" y="207" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="-1.7">Muhammad</text>
    <text x="68" y="277" fill="url(#accent)" font-size="66" font-weight="800" letter-spacing="-1.7">Sarosh</text>

    <text x="68" y="339" fill="#eeeaff" font-size="29" font-weight="650">Senior Mobile Engineer</text>
    <text x="68" y="382" fill="#bdb5dc" font-size="22">Building reliable, production-ready mobile products.</text>

    <g transform="translate(68 425)" font-size="17" font-weight="700" fill="#f4f1ff">
      <g>
        <rect width="108" height="42" rx="21" fill="#2dc7df" opacity="0.17" stroke="#2dc7df" stroke-opacity="0.65" />
        <text x="54" y="27" text-anchor="middle">Flutter</text>
      </g>
      <g transform="translate(122 0)">
        <rect width="124" height="42" rx="21" fill="#8b5cf6" opacity="0.18" stroke="#a855f7" stroke-opacity="0.65" />
        <text x="62" y="27" text-anchor="middle">BLE &amp; IoT</text>
      </g>
      <g transform="translate(260 0)">
        <rect width="154" height="42" rx="21" fill="#2dc7df" opacity="0.12" stroke="#2dc7df" stroke-opacity="0.5" />
        <text x="77" y="27" text-anchor="middle">Native SDKs</text>
      </g>
    </g>

    <text x="68" y="544" fill="#d5cee9" font-size="18" font-weight="600">linkedin.com/in/sarosh-tahir</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="786" y="44" width="362" height="542" rx="40" fill="none" stroke="url(#accent)" stroke-width="5" />
    <image x="792" y="50" width="350" height="530" xlink:href="muhammad-sarosh.jpg" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)" />
    <rect x="792" y="50" width="350" height="530" rx="34" fill="url(#portraitFade)" />
  </g>
